<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Silicon OMS • SM Flow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 40%, #152238 0%, #0d1117 75%, #080a0e 100%);
      color: #e8e0d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }

    .startup-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInScale 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    /* Ambient pulse glow behind icon */
    .glow-ring {
      position: absolute;
      inset: -14px;
      border-radius: 32px;
      background: radial-gradient(circle, rgba(7, 85, 165, 0.45) 0%, rgba(40, 152, 57, 0.25) 50%, rgba(0,0,0,0) 80%);
      filter: blur(12px);
      animation: ambientGlow 3s ease-in-out infinite alternate;
      z-index: 0;
    }

    .brand-icon {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: contain;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.12);
      z-index: 1;
      animation: floatSmooth 4s ease-in-out infinite alternate;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .brand-title span {
      background: linear-gradient(135deg, #38bdf8 0%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 36px;
    }

    /* Sleek gradient loading bar */
    .progress-bar-container {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      border-radius: 99px;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #10b981);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      animation: progressSlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .status-text {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color 0.3s ease;
    }

    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(12px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes floatSmooth {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-5px);
      }
    }

    @keyframes ambientGlow {
      0% {
        transform: scale(0.96);
        opacity: 0.5;
      }
      100% {
        transform: scale(1.12);
        opacity: 0.9;
      }
    }

    @keyframes progressSlide {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="startup-container">
    <div class="logo-wrapper">
      <div class="glow-ring"></div>
      <img src="icon.png" alt="SM Flow" class="brand-icon" />
    </div>

    <div class="brand-title">SM <span>FLOW</span></div>
    <div class="brand-subtitle">Order Management System</div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
    <div id="status" class="status-text">Connecting to workspace...</div>
  </div>

  <script>
    const DEFAULT_SERVER_URL = localStorage.getItem('sm_oms_server_url') || 'https://sm-order-management.vercel.app';

    function getServerUrl() {
      return localStorage.getItem('sm_oms_server_url') || DEFAULT_SERVER_URL;
    }

    async function checkServerConnection(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        await fetch(url.replace(/\/$/, '') + '/api/dashboard', {
          method: 'HEAD',
          mode: 'no-cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function initApp() {
      const serverUrl = getServerUrl();
      const statusEl = document.getElementById('status');

      if (!navigator.onLine) {
        window.location.replace('offline.html');
        return;
      }

      statusEl.innerText = 'Verifying workspace status...';
      const isReachable = await checkServerConnection(serverUrl);

      if (isReachable) {
        statusEl.innerText = 'Loading SM Flow...';
        window.location.replace(serverUrl);
      } else {
        window.location.replace('offline.html');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(initApp, 350);
    });
  </script>
</body>
</html>
