<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Silicon Marketing OMS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1c1c1c;
      color: #e8e0d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .brand-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #242424;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #4ecdc4;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 32px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(78, 205, 196, 0.2);
      border-top-color: #4ecdc4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 12px;
      color: #9ca3af;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="brand-logo">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4ecdc4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
  </div>

  <div class="brand-title">SILICON MARKETING</div>
  <div class="brand-subtitle">Order Management System</div>

  <div class="spinner"></div>
  <div id="status" class="status-text">Connecting to workspace...</div>

  <script>
    const DEFAULT_SERVER_URL = localStorage.getItem('sm_oms_server_url') || 'http://192.168.1.100:3001';

    function getServerUrl() {
      return localStorage.getItem('sm_oms_server_url') || DEFAULT_SERVER_URL;
    }

    async function checkServerConnection(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        await fetch(url.replace(/\/$/, '') + '/api/dashboard', {
          method: 'HEAD',
          mode: 'no-cors',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return true;
      } catch (e) {
        return false;
      }
    }

    async function initApp() {
      const serverUrl = getServerUrl();
      const statusEl = document.getElementById('status');

      if (!navigator.onLine) {
        window.location.replace('offline.html');
        return;
      }

      statusEl.innerText = 'Verifying server status...';
      const isReachable = await checkServerConnection(serverUrl);

      if (isReachable) {
        statusEl.innerText = 'Loading OMS workspace...';
        // Seamlessly bridge to live OMS
        window.location.replace(serverUrl);
      } else {
        window.location.replace('offline.html');
      }
    }

    // Launch immediately on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(initApp, 300);
    });
  </script>
</body>
</html>
