name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fleet_mobile_app/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install fleet_mobile_app dependencies
        working-directory: ./fleet_mobile_app
        run: npm ci

      - name: Build web bundle & Sync Capacitor
        working-directory: ./fleet_mobile_app
        run: |
          npm run build
          npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: ./fleet_mobile_app/android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./fleet_mobile_app/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-fleet-driver-debug-apk
          path: fleet_mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
