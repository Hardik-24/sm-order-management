name: Build SM Flow Mobile APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'oms_mobile_app/**'
      - '.github/workflows/build-oms-android.yml'

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        working-directory: ./oms_mobile_app
        run: npm install

      - name: Sync Android Platform
        working-directory: ./oms_mobile_app
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: ./oms_mobile_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm-flow-app-debug
          path: oms_mobile_app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK for Direct Release
        run: cp oms_mobile_app/android/app/build/outputs/apk/debug/app-debug.apk SM-Flow.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Latest Android APKs (SM Flow & SM Fleet)"
          body: "Direct download links for the latest Android builds without zip files or Azure egress limits."
          files: SM-Flow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
