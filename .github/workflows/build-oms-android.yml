name: Build Silicon OMS Mobile APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'oms_mobile_app/**'
      - '.github/workflows/build-oms-android.yml'

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        working-directory: ./oms_mobile_app
        run: npm install

      - name: Sync Android Platform
        working-directory: ./oms_mobile_app
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: ./oms_mobile_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: silicon-oms-app-debug
          path: oms_mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
